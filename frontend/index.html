<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HomeTwin — spatial home studio</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">HomeTwin</span>
      <span class="brand-sub">spatial home studio</span>
    </div>
    <div class="ambient">
      <span class="ambient-item">Demo room</span>
      <span class="ambient-item"><span id="sun-dot" class="dot"></span><span id="sun-state">—</span></span>
      <span class="ambient-item"><span id="lights-on">—</span></span>
    </div>
    <div class="topbar-right">
      <button id="reset-btn" class="btn" title="Turn everything off and delete deployed automations">Reset</button>
      <div id="status" class="live-pill">Connecting…</div>
    </div>
  </header>

  <main class="layout">
    <section class="canvas-card">
      <div class="canvas-toolbar">
        <label class="file-btn">Upload photo
          <input type="file" id="photo-input" accept="image/jpeg,image/png" hidden />
        </label>
        <button id="demo-btn" class="btn">Use demo room</button>
        <input id="phrase-input" placeholder="Concept phrase — e.g. lamp" />
        <button id="segment-btn" class="btn primary">Segment</button>
        <button id="draw-btn" class="btn">Draw region</button>
      </div>
      <div id="phrase-chips" class="chips"></div>
      <div id="photo-wrap">
        <img id="photo" alt="Room photo" hidden />
        <div id="regions"></div>
        <div id="photo-empty">Upload a photo — or use the demo room — to begin.<br />Then tap a device pin to select it.</div>
      </div>
      <p id="photo-msg"></p>
      <section id="sheet" class="sheet" hidden>
        <button id="sheet-close" class="sheet-close" title="Deselect">×</button>
        <div id="selected-info">Tap a pin in the photo.</div>
        <div id="tap-row">
          <button id="unbind-btn" class="btn">Unbind</button>
        </div>
      </section>
    </section>

    <aside class="panel">
      <section>
        <h2>Auto-bind</h2>
        <button id="suggest-btn" class="btn primary">Suggest bindings</button>
        <ul id="proposal-list" class="proposals"></ul>
      </section>
      <details class="fold">
        <summary>Automate <span class="fold-hint">plan details</span></summary>
        <div id="auto-row">
          <select id="source-select" title="Trigger region"></select>
          <span class="arrow">→</span>
          <select id="target-select" title="Action region"></select>
        </div>
        <input id="auto-text" placeholder="Instruction — e.g. after sunset, off after a minute" />
        <button id="plan-btn" class="btn primary">Generate plan</button>
        <div id="plan-view"></div>
      </details>
      <section>
        <h2>What-If <span class="sim-tag">simulated</span></h2>
        <div id="whatif-row">
          <select id="whatif-proposal" title="Automation proposal"></select>
          <select id="whatif-door" title="Simulated door event">
            <option value="on">door opens</option>
            <option value="off">door stays shut</option>
          </select>
          <select id="whatif-sun" title="Simulated sun">
            <option value="day">daytime</option>
            <option value="night">simulated night</option>
          </select>
        </div>
        <button id="whatif-btn" class="btn">Preview</button>
        <div id="whatif-view"></div>
      </section>
      <section>
        <h2>Regions</h2>
        <p class="legend"><span class="swatch"></span> SAM mask &nbsp;<span class="swatch dashed"></span> hand-drawn</p>
        <ul id="region-list" class="chips"></ul>
      </section>
      <details class="fold">
        <summary>Devices <span class="fold-hint">entity list</span></summary>
        <ul id="entities" class="devices"></ul>
      </details>
    </aside>
  </main>

  <!-- Day 3: binding, tap-to-control. Day 4: draw-to-automate. -->
  <script src="/static/app.js"></script>
</body>
</html>
