# HomeTwin Day 1 — virtual devices. Real HA engine, virtual entities for demo.
# Physical rollout swaps entity IDs; same API.
# Uses the modern `template:` integration format (required by current HA Core).
homeassistant:
  name: HomeTwin Demo
  unit_system: metric
  time_zone: UTC
  # Demo location drives sun times for the after-sunset condition.
  latitude: 45.5152
  longitude: -122.6784
  elevation: 50

recorder:
  purge_keep_days: 2

# Explicit sun for the after-sunset condition (Day 5).
# Kept explicit instead of default_config to preserve the minimal Day 1 surface.
sun:

# Loads the rules the approval-gated deploy path writes via the config API.
# Without this include the engine never sees deployed automations (Day 5 fix).
automation: !include automations.yaml

# Baseline inputs (frozen baseline for one-click reset on Day 3)
input_boolean:
  lamp_floor_on:
    name: Floor lamp input
    initial: off
  string_lights_on:
    name: String lights input
    initial: off
  reading_light_on:
    name: Reading light input
    initial: off
  patio_door_open:
    name: Patio door input
    initial: off
  tv_on:
    name: TV power
    initial: off
  display_on:
    name: Smart display power
    initial: off
  # Blind is optional, only if free:
  # blind_open:
  #   name: Blind input
  #   initial: off

template:
  - light:
      - name: Floor lamp
        unique_id: floor_lamp
        turn_on:
          action: input_boolean.turn_on
          target:
            entity_id: input_boolean.lamp_floor_on
        turn_off:
          action: input_boolean.turn_off
          target:
            entity_id: input_boolean.lamp_floor_on
      - name: String lights
        unique_id: string_lights
        turn_on:
          action: input_boolean.turn_on
          target:
            entity_id: input_boolean.string_lights_on
        turn_off:
          action: input_boolean.turn_off
          target:
            entity_id: input_boolean.string_lights_on
      - name: Reading light
        unique_id: reading_light
        turn_on:
          action: input_boolean.turn_on
          target:
            entity_id: input_boolean.reading_light_on
        turn_off:
          action: input_boolean.turn_off
          target:
            entity_id: input_boolean.reading_light_on
  - binary_sensor:
      - name: Patio door
        unique_id: patio_door
        device_class: door
        state: "{{ is_state('input_boolean.patio_door_open', 'on') }}"
